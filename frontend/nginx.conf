# Serves the static SPA and reverse-proxies every API call to the `api` service,
# so the browser only ever talks to one origin (no CORS needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Hash-router SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Interactive docs and health check live outside the /api prefix.
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Book covers are generated assets; let the browser cache them briefly.
    location /static/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
